name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20 }
      - run: node -e "const v=require('./package.json').version; if ('v'+v !== process.env.GITHUB_REF_NAME) throw new Error('tag/version mismatch')"
      - run: npm ci --ignore-scripts
      - run: npm install --global @openai/codex@0.144.2
      - run: npm test && npm run release:dry-run
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/caveman.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: caveman-release, path: dist/ }
      - run: gh release create "$GITHUB_REF_NAME" dist/caveman.zip dist/LICENSE dist/THIRD_PARTY_NOTICES.md dist/upstream.lock.json dist/SBOM.cdx.json dist/SHA256SUMS.json --draft --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
